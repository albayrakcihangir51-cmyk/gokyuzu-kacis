```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gökyüzü Kaçış</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;

  transform:translateX(-50%);

  position:absolute;

  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

  border:0;

  padding:9px 14px;

  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;

  color:white;

  font-size:55px;

  text-shadow:0 0 15px #00c8ff;

  cursor:pointer;

  width:320px;
  height:80px;
  border-radius:20px;
  border:4px solid white;

  box-shadow:0 0 25px #ff7b00;
}

  width:280px;
  padding:17px;
  margin:8px;
  border:0;

</head>

<body>

<div id="game">

  <div class="cloud" style="left:5%;top:12%">☁️</div>
  <div class="cloud" style="left:75%;top:20%">☁️</div>
  <div class="cloud" style="left:35%;top:5%">☁️</div>

  <div id="road"></div>
  <div id="player">🚗</div>

  <div id="hud">
    <div id="score">Skor: 0</div>
    <div id="lives">❤️❤️❤️</div>
    <button id="soundBtn">🔊</button>
  </div>

  <!-- BAŞLANGIÇ -->
  <div id="startScreen" class="overlay">
    <h1>🏎️ GÖKYÜZÜ KAÇIŞ</h1>
    <div class="info">WASD veya ok tuşlarıyla hareket et</div>
    <button id="startBtn">OYUNU BAŞLAT</button>
  </div>

  <!-- DURAKLAT -->
  <div id="pauseOverlay" class="overlay hidden">
    <h1>⏸️ DURAKLATILDI</h1>
    <button class="menuBtn" id="resumeBtn">▶️ DEVAM ET</button>
    <button class="menuBtn" id="settingsBtn">⚙️ AYARLAR</button>
    <button class="menuBtn" id="menuBtn">🏠 MENÜ</button>
  </div>

  <!-- AYARLAR -->
  <div id="settingsOverlay" class="overlay hidden">
    <h1>⚙️ AYARLAR</h1>

    <div class="setting">
      🔊 Ses:
      <input id="volume" type="range" min="0" max="100" value="70">
    </div>

    <div class="setting">
      🚗 Araç rengi:
      <br>
      <button class="colorBtn" data-color="red" style="background:red"></button>
      <button class="colorBtn" data-color="blue" style="background:blue"></button>
      <button class="colorBtn" data-color="green" style="background:green"></button>
      <button class="colorBtn" data-color="yellow" style="background:yellow"></button>
      <button class="colorBtn" data-color="black" style="background:black"></button>
      <button class="colorBtn" data-color="white" style="background:white"></button>
    </div>

    <button class="menuBtn" id="backSettings">↩️ GERİ</button>
  </div>

  <!-- SEÇİM -->
  <div id="choiceOverlay" class="overlay hidden">
    <h1>🎁 ÖDÜL SEÇ!</h1>
    <div class="info">Kutulardan birini seç!</div>

    <div class="boxes">
      <button class="box" id="boxLeft">🎁</button>
      <button class="box" id="boxRight">🎁</button>
    </div>
  </div>

  <!-- SONUÇ -->
  <div id="resultOverlay" class="overlay hidden">
    <div id="resultText"></div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverOverlay" class="overlay hidden">
    <h1>💀 OYUN BİTTİ</h1>
    <div id="finalScore" class="info"></div>
    <div id="finalHigh" class="info"></div>
    <button class="menuBtn" id="restartBtn">🔄 TEKRAR OYNA</button>
  </div>

</div>

<script>
/* =========================
   TEMEL DEĞİŞKENLER
========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");

const startScreen = document.getElementById("startScreen");
const pauseOverlay = document.getElementById("pauseOverlay");
const settingsOverlay = document.getElementById("settingsOverlay");
const choiceOverlay = document.getElementById("choiceOverlay");
const resultOverlay = document.getElementById("resultOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");

let score = 0;
let lives = 3;
let running = false;
let paused = false;
let settingsOpen = false;
let choiceOpen = false;

let playerX = 50;
let lastTime = 0;

let currentVehicle = "🚗";

let nextChoiceScore = 500;
let lastGoldHeartScore = 0;

let highScore = Number(localStorage.getItem("gokyuzuKacisHighScore") || 0);
let highScoreShown = false;

let gameVolume = Number(localStorage.getItem("gokyuzuVolume") || 70);
let carColor = localStorage.getItem("gokyuzuCarColor") || "red";

const keys = {};

const movementKeys = [
  "w","a","s","d",
  "arrowup","arrowdown","arrowleft","arrowright"
];

/* =========================
   SES
========================= */

let audioCtx = null;
let soundOn = true;

function initAudio(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }catch(e){}
}

function beep(freq,duration,type="sine",volume=.08){
  if(!soundOn || !audioCtx) return;

  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume * (gameVolume / 100);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + duration
    );
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

function startSound(){
  beep(500,.1);
  setTimeout(()=>beep(800,.12),100);
}

function crashSound(){
  beep(120,.2,"sawtooth",.12);
}

function heartSound(){
  beep(600,.1);
  setTimeout(()=>beep(900,.15),100);
}

function vehicleSound(){
  beep(700,.08);
  setTimeout(()=>beep(1000,.12),90);
}

function gameOverSound(){
  beep(500,.12,"square");
  setTimeout(()=>beep(350,.12,"square"),120);
  setTimeout(()=>beep(220,.2,"square"),240);
}

function highScoreSound(){
  beep(600,.1);
  setTimeout(()=>beep(800,.1),100);
  setTimeout(()=>beep(1000,.15),200);
}

/* =========================
   KLAVYE
========================= */

document.addEventListener("keydown",e=>{
  const key = e.key.toLowerCase();

  if(movementKeys.includes(key)){
    keys[key] = true;
    e.preventDefault();
  }

  if(key === "escape"){
    if(choiceOpen || !running) return;

    if(settingsOpen){
      settingsOpen = false;
      settingsOverlay.classList.add("hidden");
      pauseOverlay.classList.remove("hidden");
      return;
    }

    if(paused){
      resumeGame();
    }else{
      pauseGame();
    }
  }
});

document.addEventListener("keyup",e=>{
  const key = e.key.toLowerCase();

  if(movementKeys.includes(key)){
    keys[key] = false;
    e.preventDefault();
  }
});

/* =========================
   ARAÇ
========================= */

function updateVehicle(){

  let newVehicle;

  if(score >= 400){
    newVehicle = "🏁";
  }else if(score >= 250){
    newVehicle = "🏎️";
  }else if(score >= 100){
    newVehicle = "🛩️";
  }else{
    newVehicle = "🚗";
  }

  if(newVehicle !== currentVehicle){
    currentVehicle = newVehicle;
    vehicleSound();
  }

  player.textContent = currentVehicle;

  if(currentVehicle === "🚗"){
    player.style.filter = "hue-rotate(" + getHue(carColor) + "deg)";
  }else{
    player.style.filter = "none";
  }
}

function getHue(color){
  const values = {
    red:0,
    blue:200,
    green:100,
    yellow:50,
    black:0,
    white:0
  };
  return values[color] || 0;
}

/* =========================
   CAN
========================= */

function updateLives(){
  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);
}

function addLife(amount){
  lives = Math.min(3,lives + amount);
  updateLives();
}

/* =========================
   DÜŞMAN
========================= */

function createEnemy(){

  if(!running || paused || choiceOpen) return;

  const enemy = document.createElement("div");
  enemy.className = "enemy";

  let truck = Math.random() < .07;

  enemy.textContent = truck ? "🚚" : "🚙";
  enemy.dataset.truck = truck ? "1" : "0";

  const roadLeft = window.innerWidth * .20;
  const roadRight = window.innerWidth * .80;

  const x =
    roadLeft + 30 +
    Math.random() * (roadRight-roadLeft-60);

  enemy.style.left = x + "px";
  enemy.style.top = "-80px";

  game.appendChild(enemy);
}

/* =========================
   NORMAL KALP
========================= */

function createHeart(){

  if(!running || paused || choiceOpen || lives >= 3) return;

  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "❤️";

  const roadLeft = window.innerWidth*.20;
  const roadRight = window.innerWidth*.80;

  const x =
    roadLeft + 30 +
    Math.random()*(roadRight-roadLeft-60);

  heart.style.left = x+"px";
  heart.style.top = "-60px";

  game.appendChild(heart);
}

/* =========================
   ALTIN KALP
========================= */

function createGoldHeart(){

  if(!running || paused || choiceOpen) return;

  const gold = document.createElement("div");
  gold.className = "gold";
  gold.textContent = "💛";

  const roadLeft = window.innerWidth*.20;
  const roadRight = window.innerWidth*.80;

  const x =
    roadLeft + 30 +
    Math.random()*(roadRight-roadLeft-60);

  gold.style.left = x+"px";
  gold.style.top = "-60px";

  game.appendChild(gold);
}

/* =========================
   ÇARPIŞMA
========================= */

function isColliding(a,b){

  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  return !(
    r1.right < r2.left ||
    r1.left > r2.right ||
    r1.bottom < r2.top ||
    r1.top > r2.bottom
  );
}

/* =========================
   OYUNU BAŞLAT
========================= */

function startGame(){

  initAudio();

  score = 0;
  lives = 3;

  running = true;
  paused = false;
  settingsOpen = false;
  choiceOpen = false;

  playerX = 50;

  currentVehicle = "🚗";

  nextChoiceScore = 500;
  lastGoldHeartScore = 0;

  highScoreShown = false;

  document.querySelectorAll(".enemy,.heart,.gold")
    .forEach(x=>x.remove());

  startScreen.classList.add("hidden");
  pauseOverlay.classList.add("hidden");
  settingsOverlay.classList.add("hidden");
  choiceOverlay.classList.add("hidden");
  resultOverlay.classList.add("hidden");
  gameOverOverlay.classList.add("hidden");

  player.style.left = playerX+"%";

  updateLives();
  updateVehicle();
  updateScore();

  startSound();

  lastTime = performance.now();
}

/* =========================
   SKOR
========================= */

function updateScore(){

  scoreEl.textContent = "Skor: " + score;

  updateVehicle();

  if(score > highScore){

    highScore = score;

    localStorage.setItem(
      "gokyuzuKacisHighScore",
      highScore
    );

    if(!highScoreShown){

      highScoreShown = true;

      highScoreSound();

      scoreEl.textContent =
        "🏆 HIGH SKOR: " + score;

      setTimeout(updateScore,1200);
    }
  }

  if(score >= nextChoiceScore && !choiceOpen){
    openChoice();
  }

  if(
    score >= 200 &&
    score % 200 === 0 &&
    score !== lastGoldHeartScore
  ){
    lastGoldHeartScore = score;
    createGoldHeart();
  }
}

/* =========================
   SEÇİM SİSTEMİ
========================= */

let leftReward = 1;
let rightReward = 2;

function openChoice(){

  if(!running) return;

  choiceOpen = true;

  leftReward = Math.random() < .5 ? 1 : 2;
  rightReward = leftReward === 1 ? 2 : 1;

  choiceOverlay.classList.remove("hidden");
}

function chooseBox(side){

  const reward =
    side === "left"
      ? leftReward
      : rightReward;

  choiceOverlay.classList.add("hidden");

  const rewardText =
    reward === 1
      ? "🎉 +1 CAN! ❤️"
      : "🎉 +2 CAN! ❤️";

  document.getElementById("resultText").textContent =
    rewardText;

  resultOverlay.classList.remove("hidden");

  addLife(reward);

  nextChoiceScore += 500;

  setTimeout(()=>{
    resultOverlay.classList.add("hidden");
    choiceOpen = false;
  },1200);
}

document.getElementById("boxLeft")
  .addEventListener("click",()=>chooseBox("left"));

document.getElementById("boxRight")
  .addEventListener("click",()=>chooseBox("right"));

/* =========================
   OYUN DÖNGÜSÜ
========================= */

function loop(time){

  const delta = Math.min(
    (time-lastTime)/16.67,
    2
  );

  lastTime = time;

  if(running && !paused && !choiceOpen){

    let moveSpeed = 7 * delta;

    if(keys["a"] || keys["arrowleft"])
      playerX -= moveSpeed;

    if(keys["d"] || keys["arrowright"])
      playerX += moveSpeed;

    if(keys["w"] || keys["arrowup"]){
      // İleri tuşu
    }

    if(keys["s"] || keys["arrowdown"]){
      // Geri tuşu
    }

    playerX = Math.max(21,Math.min(79,playerX));

    player.style.left = playerX+"%";

    updateObjects(delta);
  }

  requestAnimationFrame(loop);
}

function updateObjects(delta){

  const enemies =
    document.querySelectorAll(".enemy");

  const hearts =
    document.querySelectorAll(".heart");

  const golds =
    document.querySelectorAll(".gold");

  let speed;

  if(score < 100){
    speed = 3 + Math.random()*2;
  }else if(score < 250){
    speed = 5 + Math.random()*3;
  }else if(score < 400){
    speed = 8 + Math.random()*4;
  }else{
    speed = 12 + Math.random()*5;
  }

  enemies.forEach(enemy=>{

    let y = parseFloat(enemy.style.top) || 0;

    y += speed * delta;

    enemy.style.top = y+"px";

    if(isColliding(player,enemy)){

      const truck = enemy.dataset.truck === "1";

      lives -= truck ? 2 : 1;

      if(lives < 0) lives = 0;

      updateLives();

      crashSound();

      enemy.remove();

      if(lives <= 0){
        gameOver();
      }

      return;
    }

    if(y > window.innerHeight+100){

      enemy.remove();

      score += 5;

      updateScore();
    }
  });

  hearts.forEach(heart=>{

    let y = parseFloat(heart.style.top) || 0;

    y += 4*delta;

    heart.style.top = y+"px";

    if(isColliding(player,heart)){

      addLife(1);
      heartSound();
      heart.remove();

      return;
    }

    if(y > window.innerHeight+80){
      heart.remove();
    }
  });

  golds.forEach(gold=>{

    let y = parseFloat(gold.style.top) || 0;

    y += 5*delta;

    gold.style.top = y+"px";

    if(isColliding(player,gold)){

      addLife(2);
      heartSound();
      gold.remove();

      return;
    }

    if(y > window.innerHeight+80){
      gold.remove();
    }
  });
}

/* =========================
   GAME OVER
========================= */

function gameOver(){

  running = false;
  paused = false;
  choiceOpen = false;

  gameOverSound();

  document.getElementById("finalScore").textContent =
    "Skorun: " + score;

  document.getElementById("finalHigh").textContent =
    "🏆 En yüksek skor: " + highScore;

  gameOverOverlay.classList.remove("hidden");
}

/* =========================
   PAUSE
========================= */

function pauseGame(){

  if(!running || choiceOpen) return;

  paused = true;

  pauseOverlay.classList.remove("hidden");
}

function resumeGame(){

  paused = false;

  pauseOverlay.classList.add("hidden");
  settingsOverlay.classList.add("hidden");

  lastTime = performance.now();
}

/* =========================
   MENÜ
========================= */

function goMenu(){

  running = false;
  paused = false;
  settingsOpen = false;
  choiceOpen = false;

  pauseOverlay.classList.add("hidden");
  settingsOverlay.classList.add("hidden");
  choiceOverlay.classList.add("hidden");
  resultOverlay.classList.add("hidden");
  gameOverOverlay.classList.add("hidden");

  document.querySelectorAll(".enemy,.heart,.gold")
    .forEach(x=>x.remove());

  startScreen.classList.remove("hidden");
}

/* =========================
   BUTONLAR
========================= */

document.getElementById("startBtn")
  .addEventListener("click",startGame);

document.getElementById("resumeBtn")
  .addEventListener("click",resumeGame);

document.getElementById("settingsBtn")
  .addEventListener("click",()=>{
    settingsOpen = true;
    pauseOverlay.classList.add("hidden");
    settingsOverlay.classList.remove("hidden");
  });

document.getElementById("backSettings")
  .addEventListener("click",()=>{
    settingsOpen = false;
    settingsOverlay.classList.add("hidden");
    pauseOverlay.classList.remove("hidden");
  });

document.getElementById("menuBtn")
  .addEventListener("click",goMenu);

document.getElementById("restartBtn")
  .addEventListener("click",startGame);

/* =========================
   SES BUTONU
========================= */

document.getElementById("soundBtn")
  .addEventListener("click",()=>{

    soundOn = !soundOn;

    document.getElementById("soundBtn").textContent =
      soundOn ? "🔊" : "🔇";

    if(soundOn){
      initAudio();
      beep(700,.1);
    }
  });

/* =========================
   AYARLAR
========================= */

const volumeSlider =
  document.getElementById("volume");

volumeSlider.value = gameVolume;

volumeSlider.addEventListener("input",()=>{
  gameVolume = Number(volumeSlider.value);

  localStorage.setItem(
    "gokyuzuVolume",
    gameVolume
  );
});

document.querySelectorAll(".colorBtn")
  .forEach(btn=>{

    btn.addEventListener("click",()=>{

      carColor = btn.dataset.color;

      localStorage.setItem(
        "gokyuzuCarColor",
        carColor
      );

      updateVehicle();
    });
  });

/* =========================
   SPAWN SİSTEMLERİ
========================= */

setInterval(createEnemy,700);

setInterval(createHeart,25000);

/* =========================
   BAŞLANGIÇ
========================= */

updateLives();
updateVehicle();

requestAnimationFrame(loop);

</script>

</body>
</html>
```

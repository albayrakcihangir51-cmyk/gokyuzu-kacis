<title>Gökyüzü Kaçış</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:linear-gradient(#55c8ff,#e7f9ff)}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
#road{position:absolute;left:20%;width:60%;height:100%;background:#555;border-left:7px solid white;border-right:7px solid white}
.cloud{position:absolute;font-size:55px;opacity:.8}
#player{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);font-size:55px;z-index:10}
.enemy,.heart,.gold{position:absolute;z-index:8;user-select:none}
.enemy{font-size:52px}
.heart{font-size:40px}
.gold{font-size:48px;filter:drop-shadow(0 0 12px gold)}
#hud{position:absolute;top:12px;left:15px;right:15px;z-index:30;display:flex;justify-content:space-between;align-items:center;color:white;font-size:22px;font-weight:bold;text-shadow:2px 2px 4px #000}
#hudLeft{display:flex;gap:22px;align-items:center}
#soundBtn{border:0;border-radius:10px;padding:8px 12px;font-size:20px}
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.78);color:white;text-align:center}
.hidden{display:none!important}
h1{font-size:52px;margin:12px;text-shadow:0 0 18px #00c8ff}
#startBtn{width:320px;height:80px;border-radius:20px;border:4px solid white;color:white;font-size:27px;background:linear-gradient(90deg,#ff3030,#ff9500,#ffe000);box-shadow:0 0 25px #ff7b00}
.menuBtn{width:280px;padding:16px;margin:8px;border:0;border-radius:15px;font-size:20px}
.boxes{display:flex;gap:55px;margin-top:25px}
.box{font-size:100px;background:none;border:0}
.setting{margin:12px;font-size:20px}
.colorBtn{width:43px;height:43px;border:3px solid white;border-radius:9px;margin:3px}
#resultOverlay{font-size:34px}
#gameOverOverlay{background:rgba(65,0,0,.85)}
</style>

<body>
<div id="game">

<div class="cloud" style="left:5%;top:12%">☁️</div>
<div class="cloud" style="left:75%;top:20%">☁️</div>
<div class="cloud" style="left:38%;top:5%">☁️</div>

<div id="road"></div>
<div id="player">🚗</div>

<div id="hud">
  <div id="hudLeft">
    <div id="score">🏆 Skor: 0</div>
    <div id="high">👑 High: 0</div>
    <div id="lives">❤️❤️❤️</div>
  </div>
  <button id="soundBtn">🔊</button>
</div>

<div id="startScreen" class="overlay">
  <h1>🏎️ GÖKYÜZÜ KAÇIŞ</h1>
  <p>WASD veya ok tuşlarıyla hareket et</p>
  <button id="startBtn">OYUNU BAŞLAT</button>
</div>

<div id="pauseOverlay" class="overlay hidden">
  <h1>⏸️ DURAKLATILDI</h1>
  <button class="menuBtn" id="resumeBtn">▶️ DEVAM ET</button>
  <button class="menuBtn" id="settingsBtn">⚙️ AYARLAR</button>
  <button class="menuBtn" id="menuBtn">🏠 MENÜ</button>
</div>

<div id="settingsOverlay" class="overlay hidden">
  <h1>⚙️ AYARLAR</h1>
  <div class="setting">🔊 Ses:
    <input id="volume" type="range" min="0" max="100">
  </div>
  <div class="setting">🚗 Araç rengi:<br>
    <button class="colorBtn" data-color="red" style="background:red"></button>
    <button class="colorBtn" data-color="blue" style="background:blue"></button>
    <button class="colorBtn" data-color="green" style="background:green"></button>
    <button class="colorBtn" data-color="yellow" style="background:yellow"></button>
    <button class="colorBtn" data-color="black" style="background:black"></button>
    <button class="colorBtn" data-color="white" style="background:white"></button>
  </div>
  <button class="menuBtn" id="backSettings">↩️ GERİ</button>
</div>

<div id="choiceOverlay" class="overlay hidden">
  <h1>🎁 ÖDÜL SEÇ!</h1>
  <p>Bir kutu seç!</p>
  <div class="boxes">
    <button class="box" id="boxLeft">🎁</button>
    <button class="box" id="boxRight">🎁</button>
  </div>
</div>

<div id="resultOverlay" class="overlay hidden">
  <div id="resultText"></div>
</div>

<div id="gameOverOverlay" class="overlay hidden">
  <h1>💀 OYUN BİTTİ</h1>
  <p id="finalScore"></p>
  <p id="finalHigh"></p>
  <button class="menuBtn" id="restartBtn">🔄 TEKRAR OYNA</button>
</div>

</div>

<script>
const player=document.getElementById("player");
const scoreEl=document.getElementById("score");
const highEl=document.getElementById("high");
const livesEl=document.getElementById("lives");

let score=0;
let lives=3;
let running=false;
let paused=false;
let choiceOpen=false;
let settingsOpen=false;
let playerX=50;
let lastTime=0;

let highScore=Number(localStorage.getItem("gokyuzuKacisHighScore")||0);
let currentVehicle="🚗";
let nextChoiceScore=500;
let lastGoldScore=0;

let soundOn=true;
let audioCtx=null;

const keys={};
const movementKeys=["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"];

document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(movementKeys.includes(k)){
    keys[k]=true;
    e.preventDefault();
  }

  if(k==="escape"){
    if(!running||choiceOpen)return;

    if(settingsOpen){
      settingsOpen=false;
      document.getElementById("settingsOverlay").classList.add("hidden");
      document.getElementById("pauseOverlay").classList.remove("hidden");
    }else if(paused){
      resumeGame();
    }else{
      pauseGame();
    }
  }
});

document.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(movementKeys.includes(k))keys[k]=false;
});

function audioStart(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}

function beep(freq,duration){
  if(!soundOn||!audioCtx)return;

  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.frequency.value=freq;
    o.type="sine";
    g.gain.value=.08;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function updateLives(){
  livesEl.textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
}

function updateHigh(){
  highEl.textContent="👑 High: "+highScore;
}

function vehicleUpdate(){

  let v="🚗";

  if(score>=400)v="🏁";
  else if(score>=250)v="🏎️";
  else if(score>=100)v="🛩️";

  if(v!==currentVehicle){
    currentVehicle=v;
    beep(700,.08);
    setTimeout(()=>beep(1000,.1),80);
  }

  player.textContent=currentVehicle;
}

function startGame(){

  audioStart();

  score=0;
  lives=3;
  playerX=50;
  running=true;
  paused=false;
  choiceOpen=false;
  settingsOpen=false;

  currentVehicle="🚗";
  nextChoiceScore=500;
  lastGoldScore=0;

  document.querySelectorAll(".enemy,.heart,.gold").forEach(e=>e.remove());

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("pauseOverlay").classList.add("hidden");
  document.getElementById("settingsOverlay").classList.add("hidden");
  document.getElementById("choiceOverlay").classList.add("hidden");
  document.getElementById("resultOverlay").classList.add("hidden");
  document.getElementById("gameOverOverlay").classList.add("hidden");

  player.style.left="50%";

  updateLives();
  updateHigh();
  updateScore();

  beep(600,.1);

  lastTime=performance.now();
}

function updateScore(){

  scoreEl.textContent="🏆 Skor: "+score;

  vehicleUpdate();

  if(score>highScore){
    highScore=score;
    localStorage.setItem("gokyuzuKacisHighScore",highScore);
    updateHigh();
  }

  if(score>=nextChoiceScore&&!choiceOpen){
    openChoice();
  }

  if(score>=200&&score%200===0&&score!==lastGoldScore){
    lastGoldScore=score;
    createGold();
  }
}

function createEnemy(){

  if(!running||paused||choiceOpen)return;

  const e=document.createElement("div");
  e.className="enemy";

  const truck=Math.random()<.07;

  e.textContent=truck?"🚚":"🚙";
  e.dataset.truck=truck?"1":"0";

  const left=window.innerWidth*.20;
  const right=window.innerWidth*.80;

  e.style.left=(left+35+Math.random()*(right-left-70))+"px";
  e.style.top="-70px";

  game.appendChild(e);
}

function createHeart(){

  if(!running||paused||choiceOpen||lives>=3)return;

  const h=document.createElement("div");
  h.className="heart";
  h.textContent="❤️";

  const left=window.innerWidth*.20;
  const right=window.innerWidth*.80;

  h.style.left=(left+35+Math.random()*(right-left-70))+"px";
  h.style.top="-60px";

  game.appendChild(h);
}

function createGold(){

  const g=document.createElement("div");
  g.className="gold";
  g.textContent="💛";

  const left=window.innerWidth*.20;
  const right=window.innerWidth*.80;

  g.style.left=(left+35+Math.random()*(right-left-70))+"px";
  g.style.top="-60px";

  game.appendChild(g);
}

function collide(a,b){
  const A=a.getBoundingClientRect();
  const B=b.getBoundingClientRect();

  return !(A.right<B.left||A.left>B.right||A.bottom<B.top||A.top>B.bottom);
}

function updateObjects(delta){

  const enemies=document.querySelectorAll(".enemy");

  enemies.forEach(e=>{

    let y=parseFloat(e.style.top)||0;

    /* DAHA YAVAŞ HIZ */
    let speed;

    if(score<100)speed=1.7;
    else if(score<250)speed=2.4;
    else if(score<400)speed=3.2;
    else speed=4.2;

    y+=speed*delta;
    e.style.top=y+"px";

    if(collide(player,e)){

      const truck=e.dataset.truck==="1";

      lives-=truck?2:1;

      if(lives<0)lives=0;

      updateLives();
      beep(150,.15);

      e.remove();

      if(lives<=0)gameOver();

      return;
    }

    if(y>window.innerHeight+100){
      e.remove();
      score+=5;
      updateScore();
    }
  });

  document.querySelectorAll(".heart").forEach(h=>{

    let y=parseFloat(h.style.top)||0;
    y+=2.5*delta;
    h.style.top=y+"px";

    if(collide(player,h)){
      lives=Math.min(3,lives+1);
      updateLives();
      beep(800,.12);
      h.remove();
    }else if(y>window.innerHeight+80){
      h.remove();
    }
  });

  document.querySelectorAll(".gold").forEach(g=>{

    let y=parseFloat(g.style.top)||0;
    y+=3*delta;
    g.style.top=y+"px";

    if(collide(player,g)){
      lives=Math.min(3,lives+2);
      updateLives();
      beep(900,.15);
      g.remove();
    }else if(y>window.innerHeight+80){
      g.remove();
    }
  });
}

function loop(time){

  const delta=Math.min((time-lastTime)/16.67,2);
  lastTime=time;

  if(running&&!paused&&!choiceOpen){

    const moveSpeed=3.5*delta;

    if(keys["a"]||keys["arrowleft"])playerX-=moveSpeed;
    if(keys["d"]||keys["arrowright"])playerX+=moveSpeed;

    playerX=Math.max(21,Math.min(79,playerX));

    player.style.left=playerX+"%";

    updateObjects(delta);
  }

  requestAnimationFrame(loop);
}

function openChoice(){

  choiceOpen=true;

  document.getElementById("choiceOverlay").classList.remove("hidden");

  window.leftReward=Math.random()<.5?1:2;
  window.rightReward=window.leftReward===1?2:1;
}

function choose(side){

  const reward=side==="left"?window.leftReward:window.rightReward;

  lives=Math.min(3,lives+reward);
  updateLives();

  document.getElementById("choiceOverlay").classList.add("hidden");

  document.getElementById("resultText").textContent=
    "🎉 +"+reward+" CAN! ❤️";

  document.getElementById("resultOverlay").classList.remove("hidden");

  nextChoiceScore+=500;

  setTimeout(()=>{
    document.getElementById("resultOverlay").classList.add("hidden");
    choiceOpen=false;
  },1200);
}

function pauseGame(){
  if(!running||choiceOpen)return;
  paused=true;
  document.getElementById("pauseOverlay").classList.remove("hidden");
}

function resumeGame(){
  paused=false;
  document.getElementById("pauseOverlay").classList.add("hidden");
  lastTime=performance.now();
}

function gameOver(){

  running=false;
  paused=false;
  choiceOpen=false;

  document.getElementById("finalScore").textContent="Skorun: "+score;
  document.getElementById("finalHigh").textContent="👑 High skor: "+highScore;

  document.getElementById("gameOverOverlay").classList.remove("hidden");

  beep(250,.2);
}

function goMenu(){

  running=false;
  paused=false;

  document.querySelectorAll(".enemy,.heart,.gold").forEach(e=>e.remove());

  document.getElementById("pauseOverlay").classList.add("hidden");
  document.getElementById("settingsOverlay").classList.add("hidden");
  document.getElementById("gameOverOverlay").classList.add("hidden");
  document.getElementById("choiceOverlay").classList.add("hidden");

  document.getElementById("startScreen").classList.remove("hidden");
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("resumeBtn").onclick=resumeGame;
document.getElementById("menuBtn").onclick=goMenu;
document.getElementById("restartBtn").onclick=startGame;

document.getElementById("settingsBtn").onclick=()=>{
  settingsOpen=true;
  document.getElementById("pauseOverlay").classList.add("hidden");
  document.getElementById("settingsOverlay").classList.remove("hidden");
};

document.getElementById("backSettings").onclick=()=>{
  settingsOpen=false;
  document.getElementById("settingsOverlay").classList.add("hidden");
  document.getElementById("pauseOverlay").classList.remove("hidden");
};

document.getElementById("boxLeft").onclick=()=>choose("left");
document.getElementById("boxRight").onclick=()=>choose("right");

document.getElementById("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇";
};

document.getElementById("volume").value=
  localStorage.getItem("gokyuzuVolume")||70;

document.getElementById("volume").oninput=e=>{
  localStorage.setItem("gokyuzuVolume",e.target.value);
};

document.querySelectorAll(".colorBtn").forEach(btn=>{
  btn.onclick=()=>{
    localStorage.setItem("gokyuzuCarColor",btn.dataset.color);
  };
});

setInterval(createEnemy,900);
setInterval(createHeart,25000);

updateHigh();
updateLives();

requestAnimationFrame(loop);
</script>

</body>
</html>
